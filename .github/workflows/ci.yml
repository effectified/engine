# The engine: type check, test (the runtime's type rules, the engine's parts, the generator against its fixtures),
# build, and check that the packed engine runs from an install. The facades it makes are tested where they live,
# in effectified/packages.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: The packed engine runs from an install
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/install" && cd "$RUNNER_TEMP/install"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/effectified-engine-*.tgz
          npx effectify --version
          test -f node_modules/@effectified/engine/src/runtime/effectify.ts

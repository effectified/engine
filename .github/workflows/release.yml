# Releases the engine, from a commit of main that passed CI, when its version is not released yet: the GitHub
# release `v<version>` of effectified/engine, its tarball what effectified/packages installs. A release is never
# replaced, so a new engine needs a new version.
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Release the engine's version if it is not released yet
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is released already"
            exit 0
          fi
          pnpm build
          pnpm pack --pack-destination "$RUNNER_TEMP"
          url="https://github.com/effectified/engine/releases/download/v$version/effectified-engine-$version.tgz"
          printf '%s\n' "@effectified/engine $version, built from $SHA." "" '```sh' "pnpm add -D $url" '```' > "$RUNNER_TEMP/NOTES.md"
          gh release create "v$version" --target "$SHA" --prerelease --title "@effectified/engine $version" \
            --notes-file "$RUNNER_TEMP/NOTES.md" "$RUNNER_TEMP/effectified-engine-$version.tgz"
